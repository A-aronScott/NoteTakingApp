<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"
    ><title>Notes App</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div id="app">
        <section id="auth-screen" class="screen">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Notes</h1>
                </div>

                    <form id="login-form">
                    <h2>Hello, Welcome</h2>
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input
                            type="email"
                            id="login-email"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input
                            type="password"
                            id="login-password"
                            required
                            autocomplete="current-password"
                        >
                    </div>

                    <p
                        id="login-error"
                        class="form-error"
                    ></p>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Sign In
                    </button>

                    <p class="auth-switch">
                        Need to Create an Account?
                        <button
                            type="button"
                            id="show-register"
                            class="text-button"
                        >
                            Click Here
                        </button>
                    </p>
                </form>

                <form
                    id="register-form"
                    class="hidden"
                >   
                    <h2>Create Account</h2>
                    <div class="form-group">
                        <label for="register-name">Name</label>
                        <input
                            type="text"
                            id="register-name"
                            required
                            autocomplete="name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input
                            type="email"
                            id="register-email"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input
                            type="password"
                            id="register-password"
                            required
                            minlength="6"
                            autocomplete="new-password"
                        >
                    </div>

                    <p  id="register-error"
                        class="form-error"
                    ></p>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Create Account
                    </button>

                    <p class="auth-switch">
                        Already have an account?
                        <button
                            type="button"
                            id="show-login"
                            class="text-button"
                        >
                            Sign in
                        </button>
                    </p>
                </form>
            </div>
        </section>

        <section
            id="notes-screen"
            class="screen hidden"
        >

            <aside class="sidebar">
                <div class="sidebar-header">
                    <h1>Notes</h1>
                    <button
                        id="new-note-button"
                        class="new-note-button"
                    >
                        + New Note
                    </button>
                </div>

                <div class="search-container">
                    <input
                        type="search"
                        id="search-input"
                        placeholder="Search notes..."
                    >
                </div>

                <nav class="sidebar-nav">
                    <button
                        class="nav-button active"
                        data-view="all"
                    >
                        All Notes
                    </button>
                    
                    <button
                        class="nav-button"
                        data-view="pinned"
                    >
                        Pinned
                    </button>

                    <button
                        class="nav-button"
                        data-view="archived"
                    >
                        Archived
                    </button>
                </nav>

                <div class="sidebar-user">

                    <div>
                        <strong id="user-name">
                            User
                        </strong>
                        <span id="user-email">
                            user@example.com
                        </span>
                    </div>
                    <button
                        id="logout-button"
                        class="logout-button"
                    >
                        Log Out
                    </button>
                </div>
            </aside>

            <main class="main-content">

                <section class="notes-panel">
                    <div class="panel-header">
                        <div>
                            <h2 id="view-title">
                                All Notes
                            </h2>
                            <span id="note-count">
                                0 notes
                            </span>
                        </div>
                    </div>

                    <div
                        id="notes-list"
                        class="notes-list"
                    >
                    </div>
                </section>

                <section class="editor-panel">
                    <div
                        id="empty-editor"
                        class="empty-editor"
                    >
                        <h2>Select a note</h2>
                        <p>
                            Choose a note from the list
                            or create a new one.
                        </p>
                    </div>

                    <div
                        id="note-editor"
                        class="note-editor hidden"
                    >
                        <div class="editor-toolbar">
                            <button
                                id="pin-button"
                                class="icon-button"
                                title="Pin note"
                            >
                                
                            </button>

                            <button
                                id="archive-button"
                                class="icon-button"
                                title="Archive note"
                            >
                                Archive
                            </button>
                            <button
                                id="delete-button"
                                class="delete-button"
                                title="Delete note"
                            >
                                Delete
                            </button>

                        </div>

                        <input
                            type="text"
                            id="note-title"
                            class="note-title-input"
                            placeholder="Note title"
                        >

                        <textarea
                            id="note-content"
                            class="note-content-input"
                            placeholder="Start writing..."
                        ></textarea>

                        <div class="editor-footer">
                            <div
                                id="save-status"
                                class="save-status"
                            >
                                Saved
                            </div>

                            <button
                                id="save-button"
                                class="primary-button"
                            >
                                Save
                            </button>
                        </div>
                    </div>
                </section>
            </main>
        </section>
    </div>

    <script src="/js/app.js"></script>

</body>
</html>
